<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWAUWI - GitHub Authentication</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="header">
                <h1>🐾 UWAUWI</h1>
                <p>Welcome! Sign in with your GitHub account to continue.</p>
            </div>
            
            <div class="error-message" id="errorMessage" style="display: none;">
                <p>Authentication failed. Please try again.</p>
            </div>
            
            <div class="auth-buttons">
                <a href="/auth/github" class="github-btn">
                    <svg class="github-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    Sign in with GitHub
                </a>
            </div>
            
            <div class="features">
                <h3>Why sign in?</h3>
                <ul>
                    <li>✨ Secure authentication with GitHub</li>
                    <li>🔒 Your data is safely stored</li>
                    <li>🚀 Quick and easy access</li>
                    <li>🎯 Personalized experience</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Check for error parameter in URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        
        if (error === 'auth_failed') {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.style.display = 'block';
            
            // Remove error from URL
            const newUrl = window.location.pathname;
            window.history.replaceState({}, document.title, newUrl);
        }
    </script>
</body>
</html>
